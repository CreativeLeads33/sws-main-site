<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Water Service</title>
    <script>
      var redirects = {
        "/jensen-beach": "/locations/jensen-beach",
        "/jupiter": "/locations/jupiter",
        "/loxahatchee": "/locations/loxahatchee",
        "/parkland": "/locations/parkland",
        "/port-st-lucie": "/locations/port-st-lucie",
        "/royal-palm-beach": "/locations/royal-palm-beach",
        "/the-acreage": "/locations/the-acreage",
        "/westlake-fl": "/locations/westlake",
        "/about-us": "/",
        "/gallery": "/",
        "/contact-us": "/",
        "/post-a-review": "/reviews"
      };
      var path = window.location.pathname;
      if (redirects[path]) {
        window.location.replace(redirects[path]);
      } else {
        var segmentCount = 0;
        var l = window.location;
        l.replace(l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?/" + l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") + (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") + l.hash);
      }
    </script>
  </head>
  <body></body>
</html>
