    <p>Schedule a free on-site water quality test from Simple Water Service. Our certified technicians test for hardness, chlorine, iron, TDS, and pH — results same day, no obligation.</p>

    <p>Hardness (calcium & magnesium), pH, chlorine/chloramine, iron, total dissolved solids (TDS), sulfur, and bacteria screening. We use professional-grade meters and give you a written report.</p>
