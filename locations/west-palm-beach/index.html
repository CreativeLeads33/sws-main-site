    <p><strong>What is in West Palm Beach tap water?</strong> PBCWUD treats Lake Okeechobee surface water with chloramine disinfection. WPB water typically measures 200–280 ppm TDS, 150–250 ppm hardness, and contains chloramines, fluoride, and trace agricultural runoff from the watershed.</p>
    <p><strong>Does West Palm Beach have hard water?</strong> Yes — WPB water consistently tests 150–250 ppm (8.7–14.6 grains per gallon), classified as very hard. This causes scale in water heaters, spotting on dishes, and dry skin after showering.</p>
    <p><strong>What is the best water filter for West Palm Beach?</strong> For whole-home treatment: a catalytic carbon filter (removes chloramines) paired with a salt-based softener (removes hardness). For drinking water: an under-sink reverse osmosis system. We recommend this combination for most WPB homes.</p>
    <p><strong>How much does a water softener cost in West Palm Beach?</strong> A quality whole-home water softener installed by Simple Water Service typically runs $1,500–$2,800 depending on home size and water hardness. We provide exact quotes after a free water test with no obligation.</p>
    <p><strong>Does West Palm Beach use chlorine or chloramine?</strong> PBCWUD uses chloramine — a combination of chlorine and ammonia. Chloramine is more persistent than chlorine and requires catalytic carbon (not standard carbon) for effective removal. This is why standard pitcher filters and refrigerator filters are less effective on WPB water.</p>
